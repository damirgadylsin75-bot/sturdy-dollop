name: Remote exec (real Roblox servers via Open Cloud)

# Runs the game headlessly on actual Roblox servers and fetches the full logs.
# Requires one-time setup by the repo owner:
#   1. Create a test place inside an experience on create.roblox.com.
#   2. Create an Open Cloud API key (Creator Dashboard -> Open Cloud -> API Keys)
#      scoped to that experience with permissions:
#        - universe-places: write
#        - universe.place.luau-execution-session: write + read
#   3. Add repository secrets: ROBLOX_API_KEY, and repository VARIABLES:
#      UNIVERSE_ID, PLACE_ID (Settings -> Secrets and variables -> Actions).
# The key lives ONLY in GitHub secrets - never in chat, never in files.
# Without the setup this workflow reports "not configured" and stays green.

permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"

jobs:
  smoke:
    name: Cloud round smoke
    runs-on: ubuntu-latest
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      UNIVERSE_ID: ${{ vars.UNIVERSE_ID }}
      PLACE_ID: ${{ vars.PLACE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run
        id: gate
        run: |
          # manual runs always execute; pushes run only when the commit
          # message contains the [remote-exec] marker (keeps CI cheap)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "${{ github.event.head_commit.message }}" | grep -q '\[remote-exec\]'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a [remote-exec] commit; skipping cloud smoke."
          fi

      - name: Install Rojo
        run: |
          curl -sL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          unzip -o rojo.zip && chmod +x rojo

      - name: Build place
        run: ./rojo build default.project.json -o game.rbxl

      - name: Guard (skip silently if not configured)
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -z "$ROBLOX_API_KEY" ] || [ -z "$UNIVERSE_ID" ] || [ -z "$PLACE_ID" ]; then
            echo "::notice::Open Cloud not configured (need secrets ROBLOX_API_KEY + vars UNIVERSE_ID/PLACE_ID). Skipping."
            touch SKIP
          fi

      - name: Upload place as Saved version
        id: publish
        continue-on-error: true
        if: steps.gate.outputs.run == 'true' && !hashFiles('SKIP')
        run: python3 tools/rbx_cloud.py publish --universe "$UNIVERSE_ID" --place "$PLACE_ID" --file game.rbxl --type Saved 2>&1 | tee publish.json

      - name: Run round smoke on real servers
        id: smoke
        continue-on-error: true
        if: steps.gate.outputs.run == 'true' && !hashFiles('SKIP') && steps.publish.outcome == 'success'
        run: python3 tools/rbx_cloud.py run --universe "$UNIVERSE_ID" --place "$PLACE_ID" --script tests/cloud_smoke.luau --timeout 240 2>&1 | tee smoke.json

      - name: Report into PR (agent-readable channel)
        if: always() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Remote exec report"
            echo ""
            echo "**publish:**"
            echo '```'
            cat publish.json 2>/dev/null || echo "(step skipped)"
            echo '```'
            echo "**smoke:**"
            echo '```'
            cat smoke.json 2>/dev/null || echo "(not reached)"
            echo '```'
          } > report.md
          PR=$(gh pr list --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body-file report.md
          else
            gh release create "remote-exec-$(date +%s)" --notes "$(cat report.md)" 2>/dev/null || cat report.md
          fi
